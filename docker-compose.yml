name: "work-holo"

services:
  electric:
    image: docker.io/electricsql/electric:1.2.9
    environment:
      DATABASE_URL: postgresql://postgres:postgres@supabase_db_db:5432/postgres
      # Not suitable for production. Only use insecure mode in development or if you've otherwise secured the Electric API.
      # See https://electric-sql.com/docs/guides/security
      ELECTRIC_INSECURE: true
    ports:
      - "5003:3000"
    networks:
      - supabase_network_db

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    ports:
      - "6379:6379"
    networks:
      - supabase_network_db
    ulimits:
      memlock: -1
    volumes:
      - dragonfly_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI port
    networks:
      - supabase_network_db
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  supabase_network_db:
    external: true

volumes:
  dragonfly_data:
  rabbitmq_data:
