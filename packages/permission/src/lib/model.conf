[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act, eft

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow)) && !some(where (p.eft == deny))

[matchers]
m =
(
  r.sub == p.sub ||
  g(r.sub, p.sub, r.dom)
)
&& r.dom == p.dom
&& keyMatch2(r.obj.name, p.obj)
&& regexMatch(r.act, p.act)
||
(
  r.obj.ownerId == r.sub
)
