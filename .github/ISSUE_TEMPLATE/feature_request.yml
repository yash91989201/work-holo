name: ✨ Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe your idea so we can evaluate and discuss it.

  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: A clear and concise description of the feature you'd like.
      placeholder: Describe the feature...
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Describe it.
      placeholder: "I'm always frustrated when..."
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see.
      placeholder: Describe how you'd like this to work...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
      placeholder: List any alternatives you've thought about...
    validations:
      required: false

  - type: dropdown
    id: app
    attributes:
      label: Affected App / Package
      description: Which part of the project would this feature apply to?
      multiple: true
      options:
        - Web (apps/web)
        - Server (apps/server)
        - Native (apps/native)
        - Desktop (Tauri)
        - Docs (apps/docs)
        - API Package (packages/api)
        - Auth Package (packages/auth)
        - DB Package (packages/db)
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or mockups about the feature request.
      placeholder: Add any additional context here...
    validations:
      required: false
