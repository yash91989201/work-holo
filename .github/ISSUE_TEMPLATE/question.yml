name: Question / Help
description: Ask a question or request help about work-holo
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Have a question about work-holo? We're happy to help! Before opening an issue, please check the [documentation](../../docs) and existing issues to see if your question has already been answered.

  - type: dropdown
    id: category
    attributes:
      label: Question Category
      description: What is your question about?
      options:
        - Setup / Installation
        - Configuration / Environment Variables
        - Authentication
        - API / oRPC Usage
        - Database / Drizzle ORM
        - Real-time Features (ElectricSQL / Pusher)
        - File Storage (MinIO)
        - Deployment
        - Contributing / Development
        - Architecture / Design Decisions
        - Other
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: What would you like to know? Please be as specific as possible.
      placeholder: How do I...?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: What Have You Tried?
      description: Describe what you have already tried or researched to answer this question.
      placeholder: I've read the docs and tried...

  - type: textarea
    id: environment
    attributes:
      label: Environment (if relevant)
      description: If your question is environment-specific, please provide details.
      placeholder: |
        - OS: [e.g. macOS 14, Windows 11, Ubuntu 22.04]
        - Bun version: [e.g. Bun 1.3.6]
        - App version / commit: [e.g. main @ abc1234]

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context or screenshots that might help answer your question. You can drag and drop images here.
