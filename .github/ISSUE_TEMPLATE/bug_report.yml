name: 🐛 Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below to help us reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: List the steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe the expected behavior...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Describe the actual behavior...
    validations:
      required: true

  - type: dropdown
    id: app
    attributes:
      label: Affected App / Package
      description: Which part of the project is affected?
      multiple: true
      options:
        - Web (apps/web)
        - Server (apps/server)
        - Native (apps/native)
        - Desktop (Tauri)
        - Docs (apps/docs)
        - API Package (packages/api)
        - Auth Package (packages/auth)
        - DB Package (packages/db)
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide details about your environment.
      placeholder: |
        - OS: [e.g., macOS 14, Windows 11, Ubuntu 24.04]
        - Browser: [e.g., Chrome 120, Safari 17]
        - Bun Version: [e.g., 1.3.7]
        - Node Version (if applicable): [e.g., 20.x]
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: Add any screenshots, error messages, or logs that help explain the problem.
      placeholder: Paste screenshots or logs here...
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the problem.
      placeholder: Add any additional context here...
    validations:
      required: false
