name: Help Wanted
description: Request community help or collaboration on a known task
title: "[Help Wanted]: "
labels: ["help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to flag a task or issue where external help or collaboration from the community is welcome.

  - type: textarea
    id: description
    attributes:
      label: Task / Problem Description
      description: Describe the task or problem that needs help. What needs to be done and why?
      placeholder: We need help with...
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: Background / Context
      description: Provide any context or background that will help contributors understand the scope of the work.
      placeholder: |
        This is related to...
        The relevant code is in...
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Type of Help Needed
      description: What kind of contribution are you looking for?
      options:
        - Code implementation
        - Code review
        - Testing / QA
        - Research / Investigation
        - Design / UX
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the codebase does this task touch?
      options:
        - Frontend (Web)
        - Backend (Server / API)
        - Database / Schema
        - Authentication
        - Real-time / Sync
        - Mobile (React Native / Expo)
        - Desktop (Tauri)
        - Documentation
        - Testing
        - Configuration / Tooling
        - Other
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: What does a successful contribution look like?
      placeholder: |
        - [ ] ...
        - [ ] ...

  - type: textarea
    id: hints
    attributes:
      label: Hints / Resources
      description: Any hints, relevant files, links, or resources that will help contributors get started.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context here.
