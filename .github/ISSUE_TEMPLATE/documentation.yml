name: Documentation Improvement
description: Report missing, incorrect, or unclear documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Good documentation helps everyone. Please help us improve ours!

  - type: dropdown
    id: type
    attributes:
      label: Documentation Type
      description: What type of documentation needs improvement?
      options:
        - README / Getting Started
        - API Documentation
        - Architecture / Design Docs
        - Setup / Installation Guide
        - Contributing Guide
        - Code Comments / JSDoc
        - Environment Variables / Configuration
        - Deployment Guide
        - Other
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Documentation Location
      description: Where is the documentation that needs improvement? (file path, URL, or section name)
      placeholder: e.g. README.md, docs/architecture.md, or "API setup section"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What Is Wrong or Missing?
      description: Describe what is incorrect, unclear, or missing from the documentation.
      placeholder: The documentation says X but the correct behavior is Y...
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Improvement
      description: If you have a suggestion for how to improve the documentation, please describe it here.
      placeholder: It would be clearer if...

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context or information here.
