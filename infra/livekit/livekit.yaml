port: 7880

rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false

keys:
  devkey: 4ad6bb4633288be276a7c5d491e980a4b3bd7957871510bc

room:
  empty_timeout: 300
  max_participants: 25

# LiveKit signs each webhook with this key and POSTs to the server, which
# mirrors room/participant lifecycle into the DB. host.docker.internal lets the
# container reach the dev server on the host (Mac/Windows). On the VPS, set this
# to the server's reachable URL.
webhook:
  api_key: devkey
  urls:
    - http://host.docker.internal:3000/webhooks/livekit

logging:
  level: info
  json: false
